name: Release APK

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            tag_name:
                description: 'Tag name to attach the APK to (e.g. v7.1.0)'
                required: true
                type: string

permissions:
    contents: write

jobs:
    build-release:
        name: Build and publish APK
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  java-version: 17
                  distribution: temurin

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v3
              with:
                  develocity-injection-enabled: false
                  cache-read-only: true

            - name: Make gradlew executable
              run: chmod +x gradlew

            - name: Build Release APK
              env:
                  SKETCHUB_API_KEY: ${{ secrets.SKETCHUB_API_KEY }}
              run: ./gradlew --no-build-cache --no-configuration-cache --no-daemon assembleRelease

            - name: Compute checksums
              working-directory: app/build/outputs/apk/release
              run: |
                  sha256sum *.apk > SHA256SUMS.txt
                  cat SHA256SUMS.txt

            - name: Resolve tag name
              id: tag
              shell: bash
              run: |
                  if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
                      echo "name=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
                  else
                      echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
                  fi

            - name: Rename APK with tag
              shell: bash
              run: |
                  cd app/build/outputs/apk/release
                  if [[ -f app-release.apk ]]; then
                      mv app-release.apk SketchwarePro-${{ steps.tag.outputs.name }}.apk
                  fi
                  ls -la

            - name: Create or update GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.tag.outputs.name }}
                  name: Sketchware Pro ${{ steps.tag.outputs.name }}
                  generate_release_notes: true
                  fail_on_unmatched_files: false
                  files: |
                      app/build/outputs/apk/release/SketchwarePro-${{ steps.tag.outputs.name }}.apk
                      app/build/outputs/apk/release/SHA256SUMS.txt

            - name: Upload APK as workflow artifact
              uses: actions/upload-artifact@v4
              with:
                  name: SketchwarePro-${{ steps.tag.outputs.name }}
                  path: app/build/outputs/apk/release/*
                  retention-days: 30
