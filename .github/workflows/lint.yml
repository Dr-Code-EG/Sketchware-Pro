name: Lint

on:
    push:
        branches:
            - main
            - upstream-v7.0.0
    pull_request:

jobs:
    detekt:
        name: Detekt (Kotlin)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  java-version: 17
                  distribution: temurin

            - name: Make gradlew executable
              run: chmod +x gradlew

            - name: Run Detekt
              continue-on-error: true
              run: ./gradlew detekt --no-daemon --continue || true

            - name: Upload Detekt SARIF
              if: always()
              uses: github/codeql-action/upload-sarif@v3
              continue-on-error: true
              with:
                  sarif_file: app/build/reports/detekt/detekt.sarif
                  category: detekt

    spotless:
        name: Spotless (formatting)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  java-version: 17
                  distribution: temurin

            - name: Make gradlew executable
              run: chmod +x gradlew

            - name: Check Spotless
              continue-on-error: true
              run: ./gradlew spotlessCheck --no-daemon || true

    android-lint:
        name: Android Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  java-version: 17
                  distribution: temurin

            - name: Make gradlew executable
              run: chmod +x gradlew

            - name: Run Android Lint
              continue-on-error: true
              run: ./gradlew :app:lintRelease --no-daemon || true

            - name: Upload Lint report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: android-lint-report
                  path: app/build/reports/lint-results-release.html
