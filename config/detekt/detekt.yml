build:
    maxIssues: 0
    excludeCorrectable: false
    weights:
        complexity: 2
        formatting: 1
        comments: 1

config:
    validation: true
    warningsAsErrors: false
    excludes: ''

complexity:
    active: true
    LongMethod:
        active: true
        threshold: 200
    LongParameterList:
        active: true
        functionThreshold: 8
        constructorThreshold: 10
    TooManyFunctions:
        active: false
    CyclomaticComplexMethod:
        active: true
        threshold: 25
    NestedBlockDepth:
        active: true
        threshold: 6
    LargeClass:
        active: true
        threshold: 600

style:
    active: true
    MagicNumber:
        active: false
    MaxLineLength:
        active: true
        maxLineLength: 140
        excludePackageStatements: true
        excludeImportStatements: true
    NewLineAtEndOfFile:
        active: true
    UnnecessaryAbstractClass:
        active: false
    WildcardImport:
        active: true
    SerialVersionUIDInSerializableClass:
        active: false

performance:
    active: true

potential-bugs:
    active: true
    UnsafeCast:
        active: true

empty-blocks:
    active: true
    EmptyFunctionBlock:
        active: true

exceptions:
    active: true
    SwallowedException:
        active: true
        ignoredExceptionTypes:
            - InterruptedException
            - NumberFormatException
            - ParseException
            - MalformedURLException

naming:
    active: true
    FunctionNaming:
        active: true
        functionPattern: '[a-z][a-zA-Z0-9]*'
    ClassNaming:
        active: true
        classPattern: '[A-Z][a-zA-Z0-9]*'
    VariableNaming:
        active: true
        variablePattern: '[a-z][A-Za-z0-9]*'

formatting:
    active: true
    android: true
    autoCorrect: true
    Indentation:
        active: true
        autoCorrect: true
        indentSize: 4
